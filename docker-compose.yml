services:
  online-exe:
    image: online-exe:${IMAGE_TAG:-1.0.0}
    container_name: online-exe
    restart: unless-stopped
    stop_grace_period: 45s        # 必须大于 shutdown 里等 inflight 的 30s
    # host 网络：容器内 remoteAddress 才是真实客户端 IP
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      MAX_UPLOAD_MB: "800"
      KEEP_PER_PLATFORM: "5"
      ADMIN_ALLOW_CIDR: ""      # 例如 10.20.0.0/16；空 = 不限制
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - /srv/online_exe/data:/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
